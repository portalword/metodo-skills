<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<style>
  :root { --bg:#050505; --s1:#101010; --s2:#181818; --line:#ffffff14; --line2:#ffffff26; --t1:#f2f2f2; --t2:#a8a8a8; --t3:#6b6b6b;
    --brand:#3B6BFF; --ok:#3dd68c; --warn:#f5b942; --r:14px; --strike:#ffffff30; color-scheme: dark; }
  :root[data-tema="claro"] { --bg:#f4f5f7; --s1:#ffffff; --s2:#eef0f3; --line:#0000001a; --line2:#00000030; --t1:#111318; --t2:#4b5160; --t3:#8a909c;
    --brand:#2557e8; --ok:#16a34a; --warn:#d97706; --strike:#00000040; color-scheme: light; }
  body, section, .it, .note { transition: background 250ms, color 250ms, border-color 250ms; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--t1); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px 16px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 700; }
  .pct { font-variant-numeric: tabular-nums; color: var(--t2); margin-left: auto; }
  .bar { height: 6px; border-radius: 99px; background: var(--s2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #011142); transition: width 500ms cubic-bezier(.2,.8,.2,1); }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .filters button { all: unset; box-sizing: border-box; height: 30px; display: inline-flex; align-items: center; white-space: nowrap; flex: none; cursor: pointer; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--t2); font-size: 12px; transition: background 150ms, color 150ms; }
  .filters button.on { background: var(--brand); color: #fff; border-color: transparent; }
  section { background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 12px; animation: rise 400ms cubic-bezier(.2,.8,.2,1) backwards; }
  section h2 { font-size: 16px; font-weight: 800; color: var(--t1); padding: 4px 8px 10px; display: flex; gap: 8px; align-items: baseline; }
  section h2 span { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; color: var(--t3); }
  section h2 span.meio { color: var(--warn); }
  .it { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px; border-radius: var(--r); transition: background 150ms; }
  .it:hover { background: var(--s2); }
  .ck { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line2); display: grid; place-items: center; margin-top: 1px; transition: background 200ms, border-color 200ms, transform 150ms; }
  .ck:hover { transform: scale(1.1); border-color: var(--brand); }
  .ck svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 260ms ease-out; }
  .it.done .ck { background: var(--ok); border-color: var(--ok); }
  .it.done .ck svg { stroke-dashoffset: 0; }
  .it.done .tx { color: var(--t3); text-decoration: line-through; text-decoration-color: var(--strike); }
  .it.meio .ck { background: var(--warn); border-color: var(--warn); }
  .it.meio .ck::after { content: ""; width: 10px; height: 3px; border-radius: 2px; background: #fff; }
  .it.meio .ck svg { display: none; }
  .it.meio .tx { color: var(--t1); }
  .it.atual { background: color-mix(in srgb, var(--brand) 12%, transparent); box-shadow: inset 3px 0 0 var(--brand); }
  .it.atual .tx { color: var(--t1); font-weight: 600; }
  .ir { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--t2); transition: transform 150ms, color 150ms, opacity 200ms; }
  .ir:hover { transform: scale(1.08); color: var(--t1); border-color: var(--brand); }
  .ir svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
  .ir.oculto { opacity: 0; pointer-events: none; }
  .grp { display: flex; align-items: center; }
  .grp .sub { display: flex; gap: 6px; max-width: 0; margin-left: 0; opacity: 0; visibility: hidden; overflow: hidden; transition: max-width 320ms cubic-bezier(.2,.8,.2,1), margin 320ms, opacity 220ms, visibility 320ms; }
  .grp.aberto .sub { max-width: 160px; margin-left: 6px; opacity: 1; visibility: visible; }
  .papel { position: relative; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 22px 28px 56px; line-height: 28px; animation: rise 300ms both;
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px); }
  .papel::before { content: ""; position: absolute; top: 0; bottom: 0; left: 40px; width: 1.5px; background: color-mix(in srgb, var(--brand) 45%, transparent); }
  .papel h3 { font-size: 15px; line-height: 28px; color: var(--t1); margin-bottom: 28px; }
  .papel .pt { margin-bottom: 28px; }
  .papel .pt > b { display: block; color: var(--brand); font-weight: 600; }
  .papel .pt p { color: var(--t1); overflow-wrap: anywhere; }
  .papel .pt p.li { padding-left: 16px; position: relative; }
  .papel .pt p.li::before { content: "•"; position: absolute; left: 2px; color: var(--t3); }
  .papel .pt p.vz { color: var(--t3); }
  .pls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pls button { all: unset; cursor: pointer; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--t2); font-size: 12px; transition: border-color 150ms, color 150ms; }
  .pls button:hover { border-color: var(--brand); } .pls button.on { border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .it.antigo .ck { pointer-events: none; }
  .papel .selo { margin-top: 8px; color: var(--ok); font-weight: 600; }
  .tema { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--t2); transition: transform 150ms, color 150ms; }
  .tema:hover { transform: scale(1.08) rotate(-12deg); color: var(--t1); }
  .tema svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .it.flash { animation: flash 900ms ease-out; }
  .tx { word-break: break-word; }
  .cbtn { all: unset; cursor: pointer; color: var(--t3); font-size: 12px; padding: 2px 8px; border-radius: 8px; border: 1px solid transparent; transition: color 150ms, border-color 150ms; white-space: nowrap; }
  .cbtn:hover { color: var(--t1); border-color: var(--line2); }
  .cbtn.has { color: var(--warn); }
  @media (hover: hover) { .cbtn:not(.has):not(.vis) { opacity: 0; } .it:hover .cbtn, .cbtn:focus-visible { opacity: 1; } }
  .tx[data-dt] { cursor: pointer; }
  .dt { display: block; margin-top: 4px; color: var(--t2); font-size: 13px; font-weight: 400; animation: rise 200ms both; }
  .eng { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--t3); transition: color 150ms, transform 250ms; }
  .eng:hover, .eng.on { color: var(--t1); } .eng.on { transform: rotate(60deg); } .eng:focus-visible { outline: 2px solid var(--brand); }
  .eng svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fut { margin-top: 14px; }
  .notes { grid-column: 2 / 4; display: grid; gap: 6px; }
  .note { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; animation: rise 300ms ease-out backwards; }
  .note .q { color: var(--t1); white-space: pre-wrap; }
  .note .a { color: var(--brand); margin-top: 4px; white-space: pre-wrap; }
  .note .w { color: var(--t3); font-size: 11px; }
  .note.ok { opacity: .55; }
  .ask { display: flex; gap: 6px; }
  .ask textarea { flex: 1; resize: vertical; min-height: 38px; background: var(--bg); color: var(--t1); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; outline: none; }
  .ask textarea:focus { border-color: var(--brand); }
  .ask button { all: unset; cursor: pointer; padding: 0 14px; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; font-size: 13px; }
  .ds { display: grid; gap: 14px; }
  .ds section h2 span { color: var(--t3); }
  .ds p, .ds li { color: var(--t2); font-size: 13px; }
  .ds ul { padding-left: 18px; display: grid; gap: 4px; }
  .ds li b, .ds p b { color: var(--t1); }
  .sws { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 8px 10px; }
  .sw { display: grid; gap: 6px; justify-items: center; font-size: 11px; color: var(--t2); font-variant-numeric: tabular-nums; cursor: pointer; }
  .sw i { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--line2); transition: transform 150ms; }
  .sw:hover i { transform: scale(1.08); }
  .grad { height: 40px; margin: 0 8px 10px; border-radius: 12px; border: 1px solid var(--line); }
  .fonts { display: grid; gap: 8px; padding: 4px 8px 10px; }
  .fonts div { display: flex; align-items: baseline; gap: 12px; }
  .fonts big { font-size: 24px; color: var(--t1); }
  .fonts small { color: var(--t3); font-size: 12px; }
  .rads { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 8px 10px; }
  .rads div { display: grid; gap: 6px; justify-items: center; font-size: 11px; color: var(--t2); }
  .rads i { width: 64px; height: 44px; border: 1.5px solid var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .rules { padding: 0 8px 8px; }
  .conc { display: flex; gap: 16px; flex-wrap: wrap; padding: 4px 8px 12px; }
  .conc > div { display: grid; gap: 6px; justify-items: center; font-size: 11px; color: var(--t2); }
  .conc .out { border: 1.5px solid var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); }
  .conc .in { width: 100%; height: 100%; background: color-mix(in srgb, var(--brand) 35%, transparent); }
  .sa { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 8px 10px; }
  .sa b { color: var(--t1); font-size: 14px; margin-right: auto; }
  .tg { all: unset; cursor: pointer; width: 42px; height: 24px; border-radius: 99px; background: var(--s2); border: 1px solid var(--line2); position: relative; transition: background 200ms; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 99px; background: var(--t2); transition: transform 200ms cubic-bezier(.2,.8,.2,1), background 200ms; }
  .tg.on { background: var(--brand); } .tg.on::after { transform: translateX(18px); background: #fff; }
  .seg { display: flex; background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: var(--t2); }
  .seg button.on { background: var(--s1); color: var(--t1); }
  .lim { width: 64px; background: var(--bg); color: var(--t1); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; outline: none; }
  .lim:focus { border-color: var(--brand); }
  .sa.off .seg, .sa.off .lim { opacity: .35; pointer-events: none; }
  .op { display: flex; align-items: center; gap: 12px; padding: 8px; border-top: 1px solid var(--line); }
  .op span { margin-right: auto; color: var(--t2); font-size: 13px; }
  .st { display: flex; align-items: center; gap: 8px; padding: 0 8px 10px; font-size: 13px; color: var(--t3); }
  .st i { width: 8px; height: 8px; border-radius: 99px; background: var(--t3); }
  .st b { color: var(--t1); font-variant-numeric: tabular-nums; }
  .st span { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
  .st.analisando { color: var(--brand); } .st.analisando i { background: var(--brand); animation: pulsa 1.4s ease-in-out infinite; }
  .st.corrigindo { color: var(--warn); } .st.corrigindo i { background: var(--warn); animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .25; transform: scale(.7); } }
  .sec.off .op { opacity: .35; pointer-events: none; }
  .hist { display: grid; gap: 6px; }
  .hi { all: unset; cursor: pointer; display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--s1); transition: border-color 150ms; }
  .hi:hover { border-color: var(--brand); }
  .hi .ps { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hi .rs { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .hi .rs.aprovado { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .hi .rs.sem-teste, .hi .rs.aceito { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .hi .sm { color: var(--t2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hi .qd { color: var(--t3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hx { grid-column: 1 / -1; color: var(--t1); font-size: 13px; white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 8px; animation: rise 200ms both; }
  .vazio { color: var(--t3); text-align: center; padding: 40px 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; background: var(--s2); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 12px; opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .toast.on { opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes flash { 0% { background: #3dd68c33; } 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="nome">Checklist</h1>
    <div class="filters" id="filtros">
      <div class="grp aberto" id="grp"><button data-f="todos" class="on">Checklist</button><div class="sub"><button id="vf" aria-pressed="false">Mostrar feitos</button></div></div><button data-f="contrato">Contrato</button><button data-f="subagents">Agentes</button><button data-f="design">Design</button></div>
    <span class="pct" id="pct"></span>
    <button class="ir" id="ir" aria-label="Atual"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button>
    <button class="tema" id="tema" aria-label="Tema"></button>
  </header>
  <div class="bar"><i id="barra" style="width:0"></i></div>
  <div id="lista"></div>
</div>
<div class="toast" id="toast"></div>
<script>
  const SOL = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const LUA = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const tema = (t) => { document.documentElement.dataset.tema = t; document.querySelector("#tema").innerHTML = t === "claro" ? LUA : SOL; try { localStorage.setItem("ck.tema", t); } catch {} };
  const irAtual = (suave = true) => document.querySelector(".it.atual")?.scrollIntoView({ behavior: suave ? "smooth" : "auto", block: "center" });
  let verFeitos = false, dtAberto = null, estado = null, filtro = "todos", aberto = null, antes = {};
  const $ = (s) => document.querySelector(s);
  const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 1800); };
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => { if (!r.ok) throw r; });

  async function carregar() {
    try {
      const e = await (await fetch("/estado")).json();
      const novo = JSON.stringify(e);
      if (novo === JSON.stringify(estado)) return;
      estado = e; desenhar();
    } catch { /* servidor fora do ar */ }
  }

  /* ── aba Design: lê design/REGRAS.md (skill design-sistema) e desenha cores, fontes e cantos ── */
  let designTxt = null;
  async function carregarDesign() { try { designTxt = (await (await fetch("/design")).json()).texto; } catch { designTxt = ""; } }
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<b>$1</b>");
  function desenharDesign() {
    if (!designTxt) { $("#lista").innerHTML = `<div class="vazio">Sem design/REGRAS.md neste projeto</div>`; return; }
    const secs = []; let cur = null;
    for (const l of designTxt.split(/\r?\n/)) {
      if (/^##\s/.test(l)) { cur = { t: l.replace(/^#+\s*/, ""), linhas: [] }; secs.push(cur); }
      else if (cur && l.trim()) cur.linhas.push(l);
    }
    let html = '<div class="ds">';
    secs.forEach((s, si) => {
      const txt = s.linhas.join("\n");
      const hexes = [...new Set((txt.match(/#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b/g) ?? []).map((h) => h.toUpperCase()))];
      const fonts = [...new Set([...txt.matchAll(/\*\*([A-Z][\w ]{2,30}?)\*\*\s+(?:para|for|nos|em)\b/g)].map((m) => m[1].trim()))];
      const forma = /forma|canto|borda|radius|arredond/i.test(s.t);
      const rads = forma ? [...txt.matchAll(/([A-Za-zÀ-ú\/]+(?:\s[A-Za-zÀ-ú\/]+)?)\s+(\d{1,2})\b/g)].map((m) => [m[1].trim(), +m[2]]).filter(([, n]) => n <= 40).slice(0, 8) : [];
      html += `<section style="animation-delay:${si * 40}ms"><h2>${esc(s.t)}</h2>`;
      if (hexes.length) {
        html += `<div class="sws">${hexes.map((h) => `<span class="sw" data-hex="${h}"><i style="background:${h}"></i>${h}</span>`).join("")}</div>`;
        if (hexes.length >= 2 && /gradiente|gradient/i.test(txt)) html += `<div class="grad" style="background:linear-gradient(120deg,${hexes.slice(0, 3).join(",")})"></div>`;
      }
      if (fonts.length) html += `<div class="fonts">${fonts.map((f) => `<div><big style="font-family:'${f}',system-ui">Aa 123 Abc</big><small>${esc(f)}</small></div>`).join("")}</div>`;
      if (rads.length) {
        // cantos concêntricos: dentro = fora − padding (regra da Apple)
        const outs = [...new Set(rads.map(([, r]) => r))].filter((r) => r >= 12).sort((a, b) => b - a).slice(0, 3);
        html += `<div class="conc">${outs.map((r) => { const pad = 8, inn = Math.max(4, r - pad);
          return `<div><span class="out" style="display:block;width:96px;height:66px;border-radius:${r}px;padding:${pad}px"><span class="in" style="display:block;border-radius:${inn}px"></span></span>${r} − ${pad} = ${inn}</div>`; }).join("")}</div>`;
      }
      if (rads.length) html += `<div class="rads">${rads.map(([n, r]) => `<div><i style="border-radius:${r}px"></i>${esc(n)} ${r}</div>`).join("")}</div>`;
      const lis = s.linhas.filter((l) => /^\s*[-*]\s/.test(l)).map((l) => `<li>${md(l.replace(/^\s*[-*]\s/, ""))}</li>`);
      const ps = s.linhas.filter((l) => !/^\s*[-*]\s/.test(l)).map((l) => `<p>${md(l)}</p>`);
      html += `<div class="rules">${ps.join("")}${lis.length ? `<ul>${lis.join("")}</ul>` : ""}</div></section>`;
    });
    $("#lista").innerHTML = html + "</div>";
  }

  /* ── ideias do PLANOS-FUTUROS.md que podem entrar no próximo contrato ── */
  async function ideiasFuturas() {
    let t = ""; try { t = (await (await fetch("/futuros")).json()).texto; } catch {}
    const out = []; let vale = false;
    for (const l of t.split(/\r?\n/)) {
      if (/^##\s/.test(l)) vale = !/promovid|descartad/i.test(l);
      else if (vale && /^\s*-\s/.test(l) && !/^\s*-\s\[x\]/i.test(l)) out.push(l.replace(/^\s*-\s(\[[ -]\]\s)?/, ""));
    }
    return out;
  }

  /* ── aba Subagents: SUBAGENTS.json (a IA lê antes de chamar um subagent; limite 0 = sem limite) ── */
  let subsCfg = null, histAberto = null, subsChave = null, cfgAberta = null;
  const OPCOES = { aprovaInterface: "Pode aprovar interface", aprovaEntrega: "Pode aprovar entrega", aprovaFuncao: "Pode aprovar função", testaEntrega: "Teste de entrega", semTestes: "Aprovar tudo sem testes" };
  const ROTULO = { aprovado: "aprovado", "sem-teste": "aprovado sem testar", aceito: "aceito por você" };
  async function desenharSubs() {
    let d; try { d = await (await fetch("/subagents")).json(); } catch { return; }
    const at = d.atual || {}, ST = { analisando: "Analisando", corrigindo: "Corrigindo" };
    const ha = (t) => { const m = Math.max(0, Math.floor((Date.now() / 1000 - t) / 60)); return m < 1 ? "agora" : m < 60 ? `há ${m} min` : `há ${Math.floor(m / 60)} h ${m % 60} min`; };
    const chave = JSON.stringify(d) + histAberto + cfgAberta + Object.values(at).map((x) => ha(x.desde));
    if (chave === subsChave && document.querySelector(".st")) return; // nada mudou: não repete a animação
    const mesma = !!document.querySelector(".st");
    subsCfg = d.subs || d; // servidor antigo devolve só a config
    if (document.activeElement?.classList.contains("lim")) return;
    subsChave = chave;
    const cards = Object.entries(subsCfg).map(([k, s], i) =>
      `<section class="sec ${s.ativo ? "" : "off"}" style="animation-delay:${i * 40}ms"><div class="sa ${s.ativo ? "" : "off"}"><b>${esc(s.nome)}</b>
        <button class="eng ${cfgAberta === k ? "on" : ""}" data-eng="${k}" aria-label="Opções" aria-expanded="${cfgAberta === k}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.1-1.2L14.200 3h-4l-.4 2.700a7 7 0 0 0-2 1.200l-2.400-1-2 3.400 2 1.500a7 7 0 0 0 0 2.400l-2 1.500 2 3.400 2.400-1a7 7 0 0 0 2 1.200l.4 2.700h4l.4-2.700a7 7 0 0 0 2-1.200l2.400 1 2-3.400-2-1.500A7 7 0 0 0 19 12z"/></svg></button>
        <button class="tg ${s.ativo ? "on" : ""}" data-sa="${k}" aria-label="Ativo"></button></div>
        ${at[k] && ST[at[k].estado] ? `<div class="st ${at[k].estado}"><i></i>${ST[at[k].estado]} <b>${esc(at[k].passo)}</b><span>${ha(at[k].desde)}</span></div>` : `<div class="st"><i></i>${!s.ativo ? "Desligado" : s.opcoes?.semTestes ? "Aprovando sem testes" : "Parado"}</div>`}
        ${cfgAberta !== k ? "" : `<div class="op"><span>Rodadas</span><div class="seg"><button data-sl="${k}" data-v="0" class="${s.limite ? "" : "on"}">Sem limite</button><button data-sl="${k}" data-v="${s.limite || 3}" class="${s.limite ? "on" : ""}">Limite</button></div>
        ${s.limite ? `<input class="lim" type="number" min="1" max="999" value="${s.limite}" data-lk="${k}" aria-label="Rodadas">` : ""}</div>
        ${s.modelo ? `<div class="op"><span>Modelo</span><div class="seg">${["haiku", "sonnet", "opus"].map((m) => `<button data-sm="${k}" data-v="${m}" class="${s.modelo === m ? "on" : ""}">${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}</div></div>` : ""}
        ${Object.entries(s.opcoes || {}).map(([o, v]) => `<div class="op"><span>${OPCOES[o] || o}</span><button class="tg ${v ? "on" : ""}" data-sk="${k}" data-op="${o}" aria-label="${OPCOES[o] || o}"></button></div>`).join("")}`}
      </section>`).join("");
    // um por passo, só se a última rodada dele passou (o arquivo guarda todas, mais recente primeiro)
    const hist = Object.entries(d.historicos || { "critico-visual": d.historico || [] }).map(([k, todas]) => {
      const vistos = new Set();
      const hs = todas.filter((x) => !vistos.has(x.passo) && vistos.add(x.passo)).filter((x) => ROTULO[x.resultado]);
      return hs.length ? `<section><h2>Histórico · ${esc(subsCfg[k]?.nome || k)}<span>${hs.length}</span></h2><div class="hist">${hs.map((x) => { const id = k + "|" + x.passo;
        return `<button class="hi" data-hi="${esc(id)}"><span class="ps">${esc(x.passo)}</span><span class="rs ${esc(x.resultado)}">${ROTULO[x.resultado]}</span><span class="sm">${esc(x.resumo)}</span><span class="qd">${esc(x.quando)}</span>${histAberto === id ? `<div class="hx">${esc(x.texto || x.resumo)}</div>` : ""}</button>`; }).join("")}</div></section>` : "";
    }).join("");
    if (filtro !== "subagents") return;
    $("#lista").innerHTML = '<div class="ds">' + cards + hist + "</div>";
    if (mesma) document.querySelectorAll("#lista section").forEach((x) => (x.style.animation = "none"));
  }

  /* ── aba Contrato: bloco "## Contrato" do ROADMAP.md, numa folha pautada ── */
  const PARTES = ["Ideia", "Prioridades", "Restrições", "Alvo", "Escopo", "Controles", "Verificação", "Pronto quando", "Ambiente"];
  let planoSel = null, planoDados = null, ctChave = null; // null = plano atual
  const seletor = (nome) => estado.planos?.length > 1 ? `<div class="pls">${estado.planos.map((n) => `<button data-pl="${n}" class="${n === (planoSel ?? estado.plano) ? "on" : ""}">${nome} ${n}</button>`).join("")}</div>` : "";
  const pegarPlano = async (n) => (await fetch("/plano?n=" + n)).json();
  async function desenharContrato() {
    const n = planoSel ?? estado.plano;
    let c, d = {};
    try { const x = await fetch("/plano?n=" + n); d = x.ok ? await x.json() : {}; c = d.contrato || await (await fetch("/contrato")).json(); } catch { return; } // servidor antigo só tem /contrato
    const fut = n === estado.plano ? await ideiasFuturas() : [];
    if (filtro !== "contrato" || n !== (planoSel ?? estado.plano)) return;
    const chave = JSON.stringify([c, n, estado.planos, fut]);
    if (chave === ctChave && $(".papel")) return; // nada mudou
    ctChave = chave;
    if (d.secoes) placar(d.secoes.flatMap((s) => s.itens));
    const corpo = (p, v) => !v ? `<p class="vz">—</p>` : (p === "Ideia" ? v.split("\n") : v.split(/\s+·\s+|\n/)).filter((x) => x.trim()).map((x) => `<p class="${p === "Ideia" || /^\d+\./.test(x) ? "" : "li"}">${md(x.replace(/^[-*]\s+/, ""))}</p>`).join("");
    const partes = PARTES.filter((p) => p !== "Controles" || c.partes[p]).map((p) => `<div class="pt"><b>${p}</b>${corpo(p, c.partes[p])}</div>`).join("");
    $("#lista").innerHTML = seletor("Contrato") + `<div class="papel"><h3>Contrato ${n}</h3>${partes}${c.aprovado ? `<div class="selo">${esc(c.aprovado)}</div>` : ""}</div>` + (fut.length ? `<div class="ds fut"><section><h2>Próximo contrato<span>${fut.length}</span></h2><div class="rules"><ul>${fut.map((x) => `<li>${md(x)}</li>`).join("")}</ul></div></section></div>` : "");
  }

  // título curto; o resto ("— pronto quando…") abre no clique
  function texto(it, velho) {
    const [tit, ...resto] = it.texto.split(/\s+—\s+/), id = (velho ? planoSel : estado.plano) + "|" + it.linha;
    if (!resto.length) return `<span class="tx">${esc(it.texto)}</span>`;
    return `<span class="tx" role="button" tabindex="0" aria-expanded="${dtAberto === id}" data-dt="${id}">${esc(tit)}${dtAberto === id ? `<span class="dt">${esc(resto.join(" — "))}</span>` : ""}</span>`;
  }

  function placar(todos) {
    const feitos = todos.filter((i) => i.feito).length;
    const meio = todos.filter((i) => i.meio).length;
    $("#pct").textContent = `${feitos}/${todos.length}` + (meio ? ` · ${meio} pela metade` : "");
    $("#barra").style.width = `${todos.length ? (feitos / todos.length) * 100 : 0}%`;
  }

  function desenhar() {
    if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return; // não atrapalha quem está digitando
    if (filtro === "design") return desenharDesign();
    if (filtro === "subagents") return void desenharSubs();
    if (filtro === "contrato") return void desenharContrato();
    $("#nome").textContent = estado.projeto;
    const velho = planoSel !== null && planoDados?.plano === planoSel;
    const secoes = velho ? planoDados.secoes : estado.secoes;
    const todos = secoes.flatMap((s) => s.itens);
    placar(todos);
    // atual = primeiro item ainda não feito (falta ou pela metade)
    const atualId = velho ? null : todos.find((i) => !i.feito)?.linha ?? null;
    const notasDe = (id) => estado.notas.filter((n) => n.id === id);
    let html = seletor("Checklist");
    if (!todos.length) html += `<div class="vazio">Checklist ${planoSel ?? estado.plano ?? ""} vazio</div>`;
    else if (!velho && !verFeitos && todos.every((i) => i.feito)) html += `<div class="vazio">Tudo feito</div>`;
    secoes.forEach((s, si) => {
      const itens = s.itens.filter((i) => velho || verFeitos || !i.feito);
      if (!itens.length) return;
      const sm = s.itens.filter((i) => i.meio).length;
      html += `<section style="animation-delay:${si * 40}ms"><h2>${esc(s.titulo)}<span class="${sm ? "meio" : ""}">${s.itens.filter((i) => i.feito).length}/${s.itens.length}${sm ? ` · ${sm} pela metade` : ""}</span></h2>`;
      for (const it of itens) {
        const ns = notasDe(it.id), pend = ns.filter((n) => !n.resolvido).length;
        const ehAtual = atualId === it.linha;
        const mudou = !velho && antes[it.linha] !== undefined && antes[it.linha] !== it.feito && it.feito;
        html += `<div class="it ${velho ? "antigo" : ""} ${ehAtual ? "atual" : ""} ${it.feito ? "done" : ""} ${it.meio ? "meio" : ""} ${mudou ? "flash" : ""}">
          <button class="ck" ${velho ? "disabled" : `data-l="${it.linha}"`} data-e="${it.feito ? "feito" : it.meio ? "meio" : "falta"}" aria-label="${it.feito ? "Marcar pela metade" : it.meio ? "Desmarcar" : "Marcar"}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
          ${texto(it, velho)}
          ${velho ? "" : `<button class="cbtn ${pend ? "has" : ns.length || aberto === it.id ? "vis" : ""}" data-c="${esc(it.id)}">${ns.length ? ns.length + (pend ? " pergunta" + (pend > 1 ? "s" : "") : " ok") : "Comentar"}</button>`}
          ${!velho && aberto === it.id ? `<div class="notes">${ns.map((n) => `<div class="note ${n.resolvido ? "ok" : ""}"><div class="w">${esc(n.quando)}</div><div class="q">${esc(n.texto)}</div>${n.resposta ? `<div class="a">IA: ${esc(n.resposta)}</div>` : ""}</div>`).join("")}
            <div class="ask"><textarea placeholder="Pergunta ou pedido sobre ${esc(it.id)}…" data-t="${esc(it.id)}"></textarea><button data-s="${esc(it.id)}">Enviar</button></div></div>` : ""}
        </div>`;
      }
      html += "</section>";
    });
    $("#lista").innerHTML = html;
    if (velho) return;
    antes = Object.fromEntries(todos.map((i) => [i.linha, i.feito]));
  }

  document.addEventListener("click", async (e) => {
    const sw = e.target.closest(".sw"); if (sw) { navigator.clipboard?.writeText(sw.dataset.hex); toast(`${sw.dataset.hex} copiado`); return; }
    const dt = e.target.closest("[data-dt]"); if (dt) { dtAberto = dtAberto === dt.dataset.dt ? null : dt.dataset.dt; return desenhar(); }
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "vf") { verFeitos = !verFeitos; t.classList.toggle("on", verFeitos); t.setAttribute("aria-pressed", verFeitos); return desenhar(); }
    if (t.dataset.eng) { cfgAberta = cfgAberta === t.dataset.eng ? null : t.dataset.eng; return desenharSubs(); }
    if (t.dataset.pl) {
      const n = +t.dataset.pl;
      if (n === estado.plano) { planoSel = planoDados = null; }
      else { try { planoDados = await pegarPlano(n); planoSel = n; } catch { return toast("Não abriu"); } }
      desenhar(); return void window.scrollTo({ top: 0 });
    }
    if (t.dataset.sa) { await post("/subagents", { id: t.dataset.sa, ativo: !subsCfg[t.dataset.sa].ativo }); return desenharSubs(); }
    if (t.dataset.sk) { await post("/subagents", { id: t.dataset.sk, opcao: t.dataset.op, valor: !subsCfg[t.dataset.sk].opcoes[t.dataset.op] }); return desenharSubs(); }
    if (t.dataset.hi !== undefined) { histAberto = histAberto === t.dataset.hi ? null : t.dataset.hi; return desenharSubs(); }
    if (t.dataset.sm) { await post("/subagents", { id: t.dataset.sm, modelo: t.dataset.v }); return desenharSubs(); }
    if (t.dataset.sl) { await post("/subagents", { id: t.dataset.sl, limite: +t.dataset.v }); return desenharSubs(); }
    if (t.dataset.l !== undefined) {
      const prox = { falta: "feito", feito: "meio", meio: "falta" }[t.dataset.e];
      try { await post("/marcar", { linha: +t.dataset.l, estado: prox }); await carregar(); } catch { toast("O ROADMAP mudou, tente de novo"); carregar(); }
    } else if (t.dataset.c !== undefined) {
      aberto = aberto === t.dataset.c ? null : t.dataset.c; desenhar();
      document.querySelector(`textarea[data-t="${CSS.escape(t.dataset.c)}"]`)?.focus();
    } else if (t.dataset.s !== undefined) {
      const ta = document.querySelector(`textarea[data-t="${CSS.escape(t.dataset.s)}"]`);
      if (!ta.value.trim()) return;
      await post("/comentar", { id: t.dataset.s, texto: ta.value });
      ta.value = ""; ta.blur(); toast("Enviado para a IA"); estado = null; carregar();
    } else if (t.dataset.f !== undefined && t.closest("#filtros")) {
      filtro = t.dataset.f; document.querySelectorAll("#filtros [data-f]").forEach((b) => b.classList.toggle("on", b === t));
      $("#lista").innerHTML = ""; const lista = filtro === "todos";
      $("#grp").classList.toggle("aberto", lista); $("#ir").classList.toggle("oculto", !lista);
      if (filtro === "design") await carregarDesign();
      desenhar(); window.scrollTo({ top: 0 });
    }
  });
  document.addEventListener("change", async (e) => { const k = e.target.dataset?.lk; if (k) { await post("/subagents", { id: k, limite: Math.max(1, +e.target.value || 1) }); e.target.blur(); desenharSubs(); } });
  document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset?.dt) { e.preventDefault(); const id = e.target.dataset.dt; e.target.click(); document.querySelector(`[data-dt="${id}"]`)?.focus(); } if (e.key === "Enter" && e.ctrlKey && e.target.dataset.t) document.querySelector(`button[data-s="${CSS.escape(e.target.dataset.t)}"]`)?.click(); });
  let t0 = null; try { t0 = localStorage.getItem("ck.tema"); } catch {}
  tema(t0 ?? (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro"));
  document.querySelector("#ir").addEventListener("click", () => irAtual());
  document.querySelector("#tema").addEventListener("click", () => tema(document.documentElement.dataset.tema === "claro" ? "escuro" : "claro"));
  carregar(); setInterval(() => { carregar(); if (filtro === "subagents") desenharSubs(); }, 2000);
</script>
</body>
</html>
