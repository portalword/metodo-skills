<!doctype html>
<!--
  Kit de amostras (design-sistema). Copie para design/1.x-nome.html e troque só as variáveis de cada .opt
  (--bg, --surface, --line, --text, --muted, --brand, --brand2, --font, --r). Cada cartão é uma opção "viva":
  hover, entrada animada, botão, campo, lista e toggle — para escolher vendo, não imaginando.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amostras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: #050505; color: #eee; font: 14px/1.5 system-ui, sans-serif; padding: 32px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; max-width: 1240px; margin: 0 auto; }
  .tag { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #fff1; font-weight: 700; margin-bottom: 10px; }

  /* ── cada opção: troque só estas variáveis ── */
  .opt { --bg:#000; --surface:#111; --line:#ffffff14; --text:#f2f2f2; --muted:#8a8a8a; --brand:#01258F; --brand2:#011142; --font:"Geist"; --r:20px;
    background: var(--bg); color: var(--text); font-family: var(--font), system-ui, sans-serif; border: 1px solid var(--line); border-radius: var(--r);
    padding: 20px; display: grid; gap: 14px; cursor: pointer;
    animation: rise 520ms cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms);
    transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 220ms, border-color 220ms; }
  .opt:hover { transform: translateY(-3px) scale(1.012); border-color: color-mix(in srgb, var(--brand) 60%, transparent); box-shadow: 0 18px 50px -18px color-mix(in srgb, var(--brand) 70%, transparent); }
  .opt.is-on { outline: 2px solid var(--brand); outline-offset: 3px; }
  .opt:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  .o2 { --brand:#6D28D9; --brand2:#2E1065; --font:"Inter"; --r:14px; }
  .o3 { --bg:#0B0F0C; --surface:#121a14; --brand:#16A34A; --brand2:#064E3B; --font:"Manrope"; --r:24px; }
  .o4 { --bg:#F6F6F4; --surface:#fff; --line:#0000001a; --text:#111; --muted:#666; --brand:#EA580C; --brand2:#9A3412; --font:"Space Grotesk"; --r:10px; }

  .h { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sw { display: flex; gap: 6px; }
  .sw i { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); }
  .grad { height: 46px; border-radius: calc(var(--r) * .6); background: linear-gradient(120deg, var(--brand), var(--brand2)); background-size: 200% 200%; transition: background-position 900ms; }
  .opt:hover .grad { background-position: 100% 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) * .7); padding: 12px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: calc(var(--r) * .5); transition: background 160ms; }
  .row:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .muted { color: var(--muted); font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; margin-left: auto; color: var(--muted); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { all: unset; padding: 8px 14px; border-radius: calc(var(--r) * .5); border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 7%, transparent); font-weight: 600; font-size: 13px; transition: transform 140ms, background 160ms; }
  .btn:hover { transform: scale(1.04); }
  .btn.pri { background: linear-gradient(120deg, var(--brand), var(--brand2)); color: #fff; border-color: transparent; }
  .field { border: 1px solid var(--line); border-radius: calc(var(--r) * .5); padding: 9px 12px; color: var(--muted); background: var(--surface); transition: border-color 160ms; }
  .opt:hover .field { border-color: var(--brand); }
  .tg { width: 34px; height: 20px; border-radius: 99px; background: var(--brand); position: relative; margin-left: auto; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 17px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 220ms cubic-bezier(.3,1.4,.5,1); }
  .opt:hover .tg::after { left: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="grid">
    <!-- duplique um bloco .opt por opção; troque a classe (o2, o3…) ou as variáveis inline -->
    <section class="opt" tabindex="0" style="--i:0">
      <span class="tag">1</span>
      <div class="h">Título da tela</div>
      <div class="sw"><i style="background:var(--bg)"></i><i style="background:var(--surface)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand2)"></i></div>
      <div class="grad"></div>
      <div class="card">
        <div class="row"><span class="dot"></span>Item da lista<span class="num">12:30</span></div>
        <div class="row"><span class="dot"></span>Outro item<span class="tg"></span></div>
        <span class="muted">texto secundário</span>
      </div>
      <div class="field">Escreva…</div>
      <div class="btns"><button class="btn pri">Principal</button><button class="btn">Secundário</button></div>
    </section>
    <section class="opt o2" tabindex="0" style="--i:1"><span class="tag">2</span><div class="h">Título da tela</div><div class="sw"><i style="background:var(--bg)"></i><i style="background:var(--surface)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand2)"></i></div><div class="grad"></div><div class="card"><div class="row"><span class="dot"></span>Item da lista<span class="num">12:30</span></div><div class="row"><span class="dot"></span>Outro item<span class="tg"></span></div><span class="muted">texto secundário</span></div><div class="field">Escreva…</div><div class="btns"><button class="btn pri">Principal</button><button class="btn">Secundário</button></div></section>
    <section class="opt o3" tabindex="0" style="--i:2"><span class="tag">3</span><div class="h">Título da tela</div><div class="sw"><i style="background:var(--bg)"></i><i style="background:var(--surface)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand2)"></i></div><div class="grad"></div><div class="card"><div class="row"><span class="dot"></span>Item da lista<span class="num">12:30</span></div><div class="row"><span class="dot"></span>Outro item<span class="tg"></span></div><span class="muted">texto secundário</span></div><div class="field">Escreva…</div><div class="btns"><button class="btn pri">Principal</button><button class="btn">Secundário</button></div></section>
    <section class="opt o4" tabindex="0" style="--i:3"><span class="tag">4</span><div class="h">Título da tela</div><div class="sw"><i style="background:var(--bg)"></i><i style="background:var(--surface)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand2)"></i></div><div class="grad"></div><div class="card"><div class="row"><span class="dot"></span>Item da lista<span class="num">12:30</span></div><div class="row"><span class="dot"></span>Outro item<span class="tg"></span></div><span class="muted">texto secundário</span></div><div class="field">Escreva…</div><div class="btns"><button class="btn pri">Principal</button><button class="btn">Secundário</button></div></section>
  </div>
  <script>
    // clicar escolhe (destaca) a opção
    document.querySelectorAll(".opt").forEach((o) => o.addEventListener("click", () => {
      document.querySelectorAll(".opt").forEach((x) => x.classList.toggle("is-on", x === o));
    }));
  </script>
</body>
</html>
